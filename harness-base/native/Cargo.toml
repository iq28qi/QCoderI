[package]
name = "qcoderi"
version = "1.3.6"
edition = "2024"

[dependencies]
tao = "=0.37.2"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
strip = true
